---
# ─── Mise à jour système ──────────────────────────────────────────────────────

- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages
  apt:
    upgrade: dist

# ─── Installation nginx ───────────────────────────────────────────────────────

- name: Install nginx
  apt:
    name: nginx
    state: present

- name: Enable and start nginx
  service:
    name: nginx
    state: started
    enabled: true

# ─── Configuration nginx ──────────────────────────────────────────────────────

- name: Deploy nginx config
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/beyond-diplegia
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable site
  file:
    src: /etc/nginx/sites-available/beyond-diplegia
    dest: /etc/nginx/sites-enabled/beyond-diplegia
    state: link
  notify: Reload nginx

- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

# ─── Déploiement du site ──────────────────────────────────────────────────────

- name: Create web root directory
  file:
    path: /var/www/beyond-diplegia
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Copy site files
  copy:
    src: "{{ playbook_dir }}/../site/"
    dest: /var/www/beyond-diplegia/
    owner: www-data
    group: www-data
    mode: "0644"
  notify: Reload nginx

# ─── Sécurité de base ─────────────────────────────────────────────────────────

- name: Remove nginx version from headers
  lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: '^\s*server_tokens'
    line: "\tserver_tokens off;"
    insertafter: "http {"
  notify: Reload nginx
